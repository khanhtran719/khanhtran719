<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Nguyen Khanh — Backend systems, built with a cinematic eye</title>
  <desc id="desc">A monochrome cinematic noir GitHub profile banner with film-frame lines and a small backend system flow: API, Queue, Data, Cache, Deploy.</desc>

  <defs>
    <linearGradient id="vignette" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.45" stop-color="#111111"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>
    <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M1 1H2V2H1V1ZM11 4H12V5H11V4ZM6 13H7V14H6V13ZM15 16H16V17H15V16Z" fill="#FFFFFF" fill-opacity="0.09"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="24" fill="url(#vignette)"/>
  <rect width="1200" height="280" rx="24" fill="url(#grain)" opacity="0.35"/>

  <!-- film frame rails -->
  <path d="M54 38H1146" stroke="#F5F5F5" stroke-opacity="0.24" stroke-width="1"/>
  <path d="M54 242H1146" stroke="#F5F5F5" stroke-opacity="0.24" stroke-width="1"/>
  <path d="M72 56V224" stroke="#F5F5F5" stroke-opacity="0.18" stroke-width="1"/>
  <path d="M1128 56V224" stroke="#F5F5F5" stroke-opacity="0.18" stroke-width="1"/>

  <!-- sprocket marks -->
  <g opacity="0.42">
    <rect x="96" y="31" width="24" height="6" rx="3" fill="#F4F4F4"/>
    <rect x="158" y="31" width="24" height="6" rx="3" fill="#F4F4F4"/>
    <rect x="220" y="31" width="24" height="6" rx="3" fill="#F4F4F4"/>
    <rect x="282" y="31" width="24" height="6" rx="3" fill="#F4F4F4"/>
    <rect x="1014" y="31" width="24" height="6" rx="3" fill="#F4F4F4"/>
    <rect x="1076" y="31" width="24" height="6" rx="3" fill="#F4F4F4"/>
    <rect x="96" y="243" width="24" height="6" rx="3" fill="#F4F4F4"/>
    <rect x="158" y="243" width="24" height="6" rx="3" fill="#F4F4F4"/>
    <rect x="220" y="243" width="24" height="6" rx="3" fill="#F4F4F4"/>
    <rect x="282" y="243" width="24" height="6" rx="3" fill="#F4F4F4"/>
    <rect x="1014" y="243" width="24" height="6" rx="3" fill="#F4F4F4"/>
    <rect x="1076" y="243" width="24" height="6" rx="3" fill="#F4F4F4"/>
  </g>

  <!-- left title block -->
  <text x="118" y="113" fill="#F7F7F2" font-family="SF Pro Display, Inter, Helvetica Neue, Arial, sans-serif" font-size="46" font-weight="650" letter-spacing="-1.4">NGUYEN KHANH</text>
  <text x="120" y="146" fill="#B9B9B1" font-family="SF Mono, ui-monospace, Menlo, Consolas, monospace" font-size="15" letter-spacing="2.4">@the.melancodeur</text>
  <text x="120" y="185" fill="#E8E8E0" font-family="SF Pro Text, Inter, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="420" letter-spacing="-0.25">Backend systems, built with a cinematic eye.</text>

  <!-- right technical system frame -->
  <g transform="translate(690 78)" font-family="SF Mono, ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.2">
    <rect x="0" y="0" width="354" height="112" rx="14" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.13"/>

    <g filter="url(#softGlow)">
      <circle cx="52" cy="56" r="22" stroke="#F1F1EA" stroke-opacity="0.7"/>
      <circle cx="140" cy="56" r="22" stroke="#F1F1EA" stroke-opacity="0.62"/>
      <circle cx="228" cy="56" r="22" stroke="#F1F1EA" stroke-opacity="0.62"/>
      <circle cx="306" cy="56" r="22" stroke="#F1F1EA" stroke-opacity="0.7"/>
      <path d="M74 56H118" stroke="#F1F1EA" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="4 6"/>
      <path d="M162 56H206" stroke="#F1F1EA" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="4 6"/>
      <path d="M250 56H284" stroke="#F1F1EA" stroke-opacity="0.45" stroke-width="1.2" stroke-dasharray="4 6"/>
    </g>

    <text x="38" y="60" fill="#F6F6EF">API</text>
    <text x="119" y="60" fill="#D7D7CF">QUEUE</text>
    <text x="212" y="60" fill="#D7D7CF">DATA</text>
    <text x="283" y="60" fill="#F6F6EF">SHIP</text>

    <text x="24" y="96" fill="#8D8D86">root cause</text>
    <text x="139" y="96" fill="#8D8D86">sync</text>
    <text x="214" y="96" fill="#8D8D86">infra</text>
    <text x="286" y="96" fill="#8D8D86">clean fixes</text>
  </g>

  <!-- small visual signature -->
  <g opacity="0.28">
    <path d="M958 188C1000 154 1038 158 1086 196" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M970 204C1006 178 1038 181 1072 207" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="990" cy="190" r="3" fill="#FFFFFF"/>
  </g>

  <text x="1048" y="222" fill="#77776F" font-family="SF Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.6">SYSTEMS / FRAMES</text>
</svg>
