<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The Melan Codeur — Nguyen Khanh</title>
  <desc id="desc">A cinematic noir GitHub profile banner combining a film contact sheet, production-grade backend system map, and Nguyen Khanh's creative signature.</desc>

  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18140D"/>
      <stop offset="0.28" stop-color="#090908"/>
      <stop offset="0.72" stop-color="#050506"/>
      <stop offset="1" stop-color="#111111"/>
    </linearGradient>

    <radialGradient id="lamp" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(258 72) rotate(62) scale(360 520)">
      <stop offset="0" stop-color="#E5C16D" stop-opacity="0.55"/>
      <stop offset="0.22" stop-color="#B9873D" stop-opacity="0.22"/>
      <stop offset="0.65" stop-color="#111111" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="monitorGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(878 164) rotate(90) scale(180 320)">
      <stop offset="0" stop-color="#CFC8B5" stop-opacity="0.22"/>
      <stop offset="0.48" stop-color="#6E6659" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grain" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M2 3H3V4H2V3ZM18 5H19V6H18V5ZM10 11H11V12H10V11ZM5 18H6V19H5V18ZM15 16H16V17H15V16Z" fill="#FFFFFF" fill-opacity="0.08"/>
    </pattern>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.9  0 1 0 0 0.78  0 0 1 0 0.48  0 0 0 0.75 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="30" fill="url(#base)"/>
  <rect width="1200" height="360" rx="30" fill="url(#lamp)"/>
  <rect width="1200" height="360" rx="30" fill="url(#monitorGlow)"/>
  <rect width="1200" height="360" rx="30" fill="url(#grid)" opacity="0.85"/>
  <rect width="1200" height="360" rx="30" fill="url(#grain)" opacity="0.45"/>

  <!-- cinema safe frame -->
  <rect x="34" y="30" width="1132" height="300" rx="18" stroke="#F5E8C8" stroke-opacity="0.18"/>
  <path d="M76 70H456" stroke="#F5E8C8" stroke-opacity="0.20"/>
  <path d="M76 290H456" stroke="#F5E8C8" stroke-opacity="0.16"/>
  <path d="M786 70H1124" stroke="#F5E8C8" stroke-opacity="0.14"/>
  <path d="M786 290H1124" stroke="#F5E8C8" stroke-opacity="0.14"/>

  <!-- film contact strip -->
  <g transform="translate(54 54)" opacity="0.95">
    <rect x="0" y="0" width="88" height="252" rx="14" fill="#0A0A0A" stroke="#F8E4B0" stroke-opacity="0.18"/>
    <g opacity="0.55" fill="#D7C28E">
      <rect x="12" y="16" width="13" height="8" rx="2"/>
      <rect x="12" y="44" width="13" height="8" rx="2"/>
      <rect x="12" y="72" width="13" height="8" rx="2"/>
      <rect x="12" y="100" width="13" height="8" rx="2"/>
      <rect x="12" y="128" width="13" height="8" rx="2"/>
      <rect x="12" y="156" width="13" height="8" rx="2"/>
      <rect x="12" y="184" width="13" height="8" rx="2"/>
      <rect x="12" y="212" width="13" height="8" rx="2"/>
      <rect x="63" y="16" width="13" height="8" rx="2"/>
      <rect x="63" y="44" width="13" height="8" rx="2"/>
      <rect x="63" y="72" width="13" height="8" rx="2"/>
      <rect x="63" y="100" width="13" height="8" rx="2"/>
      <rect x="63" y="128" width="13" height="8" rx="2"/>
      <rect x="63" y="156" width="13" height="8" rx="2"/>
      <rect x="63" y="184" width="13" height="8" rx="2"/>
      <rect x="63" y="212" width="13" height="8" rx="2"/>
    </g>
    <rect x="31" y="22" width="26" height="52" rx="4" fill="#191713" stroke="#F8E4B0" stroke-opacity="0.12"/>
    <rect x="31" y="90" width="26" height="52" rx="4" fill="#141414" stroke="#F8E4B0" stroke-opacity="0.12"/>
    <rect x="31" y="158" width="26" height="52" rx="4" fill="#1A1710" stroke="#F8E4B0" stroke-opacity="0.12"/>
    <path d="M36 196C42 180 49 178 54 198" stroke="#D7C28E" stroke-opacity="0.35"/>
  </g>

  <!-- editorial title -->
  <g transform="translate(174 92)">
    <text x="0" y="0" fill="#F6E9CA" font-family="SF Mono, ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="3.6">THE MELAN CODEUR</text>
    <text x="0" y="74" fill="#FAF7EF" font-family="SF Pro Display, Inter, Helvetica Neue, Arial, sans-serif" font-size="64" font-weight="760" letter-spacing="-3.1">NGUYEN KHANH</text>
    <text x="2" y="112" fill="#D7D0C0" font-family="SF Pro Text, Inter, Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="430" letter-spacing="-0.35">Backend systems, built with a cinematic eye.</text>
    <g transform="translate(2 148)" font-family="SF Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.45">
      <text x="0" y="0" fill="#AFA58C">POS</text>
      <circle cx="42" cy="-4" r="2" fill="#C8A85B"/>
      <text x="60" y="0" fill="#AFA58C">HR</text>
      <circle cx="94" cy="-4" r="2" fill="#C8A85B"/>
      <text x="112" y="0" fill="#AFA58C">E-LEARNING</text>
      <circle cx="212" cy="-4" r="2" fill="#C8A85B"/>
      <text x="230" y="0" fill="#AFA58C">QUEUES</text>
      <circle cx="306" cy="-4" r="2" fill="#C8A85B"/>
      <text x="324" y="0" fill="#AFA58C">CDC</text>
      <circle cx="372" cy="-4" r="2" fill="#C8A85B"/>
      <text x="390" y="0" fill="#AFA58C">INFRA</text>
    </g>
  </g>

  <!-- system monitor panel -->
  <g transform="translate(686 86)" filter="url(#softShadow)">
    <rect x="0" y="0" width="402" height="214" rx="18" fill="#090909" fill-opacity="0.76" stroke="#F4E0AA" stroke-opacity="0.17"/>
    <rect x="16" y="18" width="370" height="42" rx="10" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.07"/>
    <text x="31" y="44" fill="#E8DBC0" font-family="SF Mono, ui-monospace, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.8">PRODUCTION MAP / ROOT CAUSE FIRST</text>

    <g font-family="SF Mono, ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2">
      <path d="M70 118H144M184 118H258M298 118H346" stroke="#E4C879" stroke-opacity="0.52" stroke-dasharray="4 8"/>
      <path d="M144 118C154 82 172 82 184 118" stroke="#E4C879" stroke-opacity="0.28"/>
      <path d="M258 118C268 154 286 154 298 118" stroke="#E4C879" stroke-opacity="0.28"/>

      <g filter="url(#blurGlow)">
        <rect x="34" y="94" width="70" height="48" rx="12" fill="#15120B" stroke="#F2D68D" stroke-opacity="0.58"/>
        <rect x="134" y="94" width="70" height="48" rx="12" fill="#111111" stroke="#F2D68D" stroke-opacity="0.46"/>
        <rect x="234" y="94" width="70" height="48" rx="12" fill="#111111" stroke="#F2D68D" stroke-opacity="0.46"/>
        <rect x="318" y="94" width="54" height="48" rx="12" fill="#15120B" stroke="#F2D68D" stroke-opacity="0.58"/>
      </g>

      <text x="51" y="123" fill="#FFF8E8">API</text>
      <text x="147" y="123" fill="#E6DCC6">QUEUE</text>
      <text x="249" y="123" fill="#E6DCC6">DATA</text>
      <text x="328" y="123" fill="#FFF8E8">SHIP</text>

      <text x="34" y="176" fill="#9E957F">correctness</text>
      <text x="142" y="176" fill="#9E957F">sync</text>
      <text x="210" y="176" fill="#9E957F">cache</text>
      <text x="286" y="176" fill="#9E957F">deploy</text>
    </g>
  </g>

  <!-- camera metadata / signature -->
  <g font-family="SF Mono, ui-monospace, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.6" fill="#817865">
    <text x="174" y="300">ISO 400  ·  f/2.8  ·  24 FPS</text>
    <text x="848" y="322">@the.melancodeur</text>
    <text x="1012" y="322">SYSTEMS / FRAMES</text>
  </g>
</svg>
