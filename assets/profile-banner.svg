<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The Melan Codeur — Nguyen Khanh, pencil sketch banner</title>
  <desc id="desc">A black and white pencil sketch style GitHub profile banner with hand-drawn film frames, backend system notes, and Nguyen Khanh's creative signature.</desc>

  <defs>
    <filter id="paperNoise" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="softNoise">
        <feFuncA type="table" tableValues="0 0.13"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="multiply"/>
    </filter>

    <filter id="pencilRough" x="-4%" y="-8%" width="108%" height="116%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="9" result="rough"/>
      <feDisplacementMap in="SourceGraphic" in2="rough" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <pattern id="paperFibres" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M3 7C8 5 14 6 20 4M10 17C16 15 21 18 30 15M0 28C9 27 16 24 25 27" stroke="#161616" stroke-opacity="0.045" stroke-width="0.8" stroke-linecap="round"/>
      <circle cx="28" cy="6" r="0.8" fill="#111" fill-opacity="0.04"/>
      <circle cx="7" cy="23" r="0.6" fill="#111" fill-opacity="0.05"/>
    </pattern>

    <style>
      .sketch { stroke:#151515; stroke-linecap:round; stroke-linejoin:round; filter:url(#pencilRough); }
      .ghost { stroke:#151515; stroke-opacity:.25; stroke-linecap:round; stroke-linejoin:round; filter:url(#pencilRough); }
      .soft { fill:#151515; fill-opacity:.68; }
      .muted { fill:#151515; fill-opacity:.52; }
      .tiny { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size:11px; letter-spacing:1.3px; }
    </style>
  </defs>

  <rect width="1200" height="300" rx="24" fill="#F7F5EF"/>
  <rect width="1200" height="300" rx="24" fill="url(#paperFibres)" filter="url(#paperNoise)"/>

  <!-- uneven outer pencil frame -->
  <g class="sketch" fill="none">
    <path d="M38 36C212 31 408 34 575 32C792 31 969 34 1161 31" stroke-width="1.45" stroke-opacity="0.78"/>
    <path d="M40 40C236 38 404 39 594 37C801 36 982 37 1159 36" stroke-width="0.8" stroke-opacity="0.38"/>
    <path d="M1162 35C1165 91 1160 155 1164 219C1165 242 1161 265 1158 271" stroke-width="1.35" stroke-opacity="0.72"/>
    <path d="M38 267C208 272 433 267 628 270C807 273 985 268 1158 270" stroke-width="1.45" stroke-opacity="0.78"/>
    <path d="M41 34C36 86 40 143 37 196C35 226 39 249 38 268" stroke-width="1.35" stroke-opacity="0.72"/>
  </g>

  <!-- left: hand-drawn film/contact sheet -->
  <g transform="translate(68 62)" class="sketch" fill="none">
    <path d="M2 5C31 1 61 3 88 6C94 48 91 96 93 138C94 153 90 170 88 179C59 184 28 181 3 178C-1 126 1 73 2 5Z" stroke-width="1.8"/>
    <path d="M8 14C33 12 62 13 84 15" stroke-width="0.7" stroke-opacity="0.45"/>
    <path d="M10 169C35 172 62 170 84 168" stroke-width="0.7" stroke-opacity="0.45"/>

    <g stroke-width="1" stroke-opacity="0.5">
      <path d="M15 24H25M15 45H25M15 66H25M15 87H25M15 108H25M15 129H25M15 150H25"/>
      <path d="M68 24H78M68 45H78M68 66H78M68 87H78M68 108H78M68 129H78M68 150H78"/>
    </g>

    <path d="M32 25C41 23 51 24 61 26C62 47 61 60 59 72C50 75 40 74 32 72C30 55 31 39 32 25Z" stroke-width="1.15"/>
    <path d="M31 86C42 84 52 84 61 87C61 106 62 121 59 134C49 136 40 136 31 133C30 116 29 102 31 86Z" stroke-width="1.15"/>
    <path d="M35 63C41 54 48 51 57 64" stroke-width="1" stroke-opacity="0.55"/>
    <path d="M34 124C42 108 51 110 58 125" stroke-width="1" stroke-opacity="0.55"/>
    <path d="M27 191C47 186 69 188 91 194" stroke-width="1" stroke-opacity="0.38"/>
    <text x="0" y="205" class="tiny soft" stroke="none">street frames</text>
  </g>

  <!-- center: editorial identity -->
  <g transform="translate(205 78)">
    <text x="0" y="0" class="tiny muted">THE MELAN CODEUR</text>
    <text x="0" y="64" fill="#111" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" letter-spacing="-2.4">Nguyen Khanh</text>
    <path class="ghost" d="M3 79C101 75 230 80 345 76C394 74 444 76 496 78" stroke-width="1.4" fill="none"/>
    <text x="2" y="112" fill="#222" fill-opacity="0.72" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="0.2">Backend systems, from root cause to production.</text>

    <g transform="translate(2 145)" class="tiny muted">
      <text x="0" y="0">POS</text>
      <text x="54" y="0">HR</text>
      <text x="97" y="0">E-LEARNING</text>
      <text x="210" y="0">QUEUES</text>
      <text x="300" y="0">CDC</text>
      <text x="356" y="0">INFRA</text>
    </g>

    <g class="ghost" fill="none" stroke-width="0.9">
      <path d="M35 138C43 142 48 143 54 139"/>
      <path d="M78 138C83 142 88 142 95 139"/>
      <path d="M188 138C196 143 202 142 210 139"/>
      <path d="M276 138C285 143 292 142 300 139"/>
      <path d="M333 138C342 143 350 142 356 139"/>
    </g>
  </g>

  <!-- right: sketched backend system diagram -->
  <g transform="translate(742 74)">
    <path d="M12 3C94 1 173 3 258 2C313 2 361 3 394 5C398 48 395 96 397 145C399 165 396 185 392 202C297 205 208 202 109 204C67 205 33 202 12 199C7 143 9 86 12 3Z" fill="#fff" fill-opacity="0.27" stroke="#151515" stroke-width="1.5" stroke-linejoin="round" filter="url(#pencilRough)"/>
    <path d="M22 29C72 26 120 29 171 28C237 27 306 27 382 30" class="ghost" stroke-width="1" fill="none"/>
    <text x="29" y="23" class="tiny muted">production notes / not a magic diagram</text>

    <g class="sketch" fill="#F7F5EF" stroke-width="1.4">
      <path d="M39 88C56 84 78 84 96 88C100 103 98 116 96 128C78 132 55 131 39 127C36 113 36 101 39 88Z"/>
      <path d="M143 87C162 84 185 84 204 88C207 102 206 116 203 128C186 132 162 132 143 128C140 114 140 101 143 87Z"/>
      <path d="M248 87C267 84 291 84 309 88C313 102 311 116 309 128C290 132 268 131 248 128C245 114 245 101 248 87Z"/>
      <path d="M334 87C347 84 363 84 376 88C378 102 378 116 375 128C362 132 347 132 334 128C331 113 332 101 334 87Z"/>
    </g>

    <g class="tiny soft">
      <text x="54" y="113">API</text>
      <text x="154" y="113">QUEUE</text>
      <text x="261" y="113">DATA</text>
      <text x="341" y="113">SHIP</text>
    </g>

    <g class="ghost" fill="none" stroke-width="1.15">
      <path d="M98 108C113 106 127 106 142 108"/>
      <path d="M206 108C220 107 234 107 248 108"/>
      <path d="M310 108C318 107 326 107 334 108"/>
      <path d="M137 104L143 108L137 112"/>
      <path d="M242 104L249 108L242 112"/>
      <path d="M328 104L334 108L328 112"/>
      <path d="M67 154C110 149 151 153 191 151C239 148 283 151 337 149"/>
      <path d="M78 166C106 164 132 165 162 163"/>
      <path d="M190 166C220 164 249 165 282 163"/>
      <path d="M307 166C326 164 341 165 359 163"/>
    </g>

    <g class="tiny muted">
      <text x="44" y="177">correctness</text>
      <text x="176" y="177">sync</text>
      <text x="238" y="177">cache</text>
      <text x="314" y="177">deploy</text>
    </g>
  </g>

  <!-- graphite marks and signature -->
  <g class="ghost" fill="none">
    <path d="M172 235C229 232 284 235 339 233" stroke-width="0.9"/>
    <path d="M419 237C463 234 505 236 550 233" stroke-width="0.8"/>
    <path d="M612 231C660 227 706 229 751 226" stroke-width="0.8"/>
    <path d="M1028 251C1068 247 1101 250 1134 247" stroke-width="0.95"/>
  </g>

  <g class="tiny muted">
    <text x="205" y="254">pencil / graphite / system boundaries</text>
    <text x="1012" y="286">@the.melancodeur</text>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="299" rx="23.5" stroke="#111" stroke-opacity="0.08"/>
</svg>
